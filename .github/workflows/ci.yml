name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          chmod -R +x node_modules/.bin || true
          npm install --ignore-scripts
          chmod -R +x node_modules/.bin || true
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/medeasy?schema=public"

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/medeasy?schema=public"
          NEXTAUTH_SECRET: "ci-secret-build-key-at-least-32-chars-long"
          NEXTAUTH_URL: "http://localhost:3000"
