services:
  db:
    image: postgres:15-alpine
    container_name: medeasy_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medeasy_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medeasy_password}
      POSTGRES_DB: ${POSTGRES_DB:-medeasy_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medeasy_dev} -d ${POSTGRES_DB:-medeasy_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
